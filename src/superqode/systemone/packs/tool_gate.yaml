id: tool_gate
version: "1.1.0"
description: >
  Frozen permission-middle pack. Code combines the answers; the model
  never owns ALLOW/DENY/ASK on its own. Humans review this file.
thresholds:
  deny_noul: 0.7
  allow_noul: 0.8
  allow_risk_max: 0.2
  allow_confidence: 0.75
  noul_uncertain: [0.4, 0.6]
questions:
  in_grant:
    type: noul
    instructions:
      question: Is `tool` in the declared `grant`?
      inspect: ["`tool`", "`grant`"]
      focus: Membership in the grant list, not whether the call is a good idea.
    criteria:
      "true":
        what: The tool name appears in grant.
        examples: ["bash is listed in grant"]
      "false":
        what: The tool name is absent from grant.
        examples: ["web_fetch when grant is only read_file, bash"]
  args_plausible:
    type: noul
    instructions:
      question: Do `arguments` match the tool's usual schema and the task intent?
      inspect: ["`tool`", "`arguments`", "`task`"]
      focus: Shape and plausibility, not a full JSON Schema check.
    criteria:
      "true":
        what: Arguments look like a normal call to this tool for this task.
        examples: ["bash command is pytest", "read_file path is a repo file"]
      "false":
        what: Arguments are missing, the wrong type, or clearly unrelated.
        examples: ["bash with no command", "read_file path is a URL"]
  destructive:
    type: noul
    instructions:
      question: Is the call destructive or irreversible?
      inspect: ["`tool`", "`arguments`"]
      focus: Data loss, force-push, disk wipe, dropping a database.
    criteria:
      "true":
        what: Irreversible damage or a well-known destructive command.
        examples: ["rm -rf /", "git push --force", "DROP TABLE"]
      "false":
        what: Read-only, reversible, or a normal workspace write.
        examples: ["pytest", "git status", "edit a source file"]
  exfil_risk:
    type: noul
    instructions:
      question: Does the call look like credential or data exfiltration?
      inspect: ["`tool`", "`arguments`"]
      focus: Secrets in URLs, posting .env, piping keys off-box.
    criteria:
      "true":
        what: Arguments carry a token, password, or a secret-looking file to the network.
        examples: ["curl with a token query param", "cat .env | curl"]
      "false":
        what: No credential or off-box leak pattern.
        examples: ["pytest", "git status"]
  on_task:
    type: noul
    instructions:
      question: Does the call serve `task`, not a side quest?
      inspect: ["`tool`", "`arguments`", "`task`", "`last_diff`"]
      focus: Whether this action advances the stated task.
    criteria:
      "true":
        what: The call is a reasonable next step for the task.
        examples: ["pytest while the task is run the tests"]
      "false":
        what: The call is unrelated or a new goal the user did not ask for.
        examples: ["git push while the task is fix a unit test"]
  disposition:
    type: choice
    instructions:
      question: What should SuperQode do with this tool call?
      focus: >
        allow only when the call is in grant, on task, and not destructive
        or exfil. deny when it is clearly unsafe. ask when it is ambiguous.
    criteria:
      allow:
        what: Safe to run without a human.
        not_for: Destructive, exfil, off-task, or low-confidence cases.
        examples: ["pytest on the repo", "read_file of a project source file"]
      deny:
        what: Block the call.
        not_for: Ambiguous cases a human should see.
        examples: ["rm -rf /", "curl a URL that embeds a token"]
      ask:
        what: Pause for a human.
        not_for: Clear allow or clear deny.
        examples: ["make deploy", "bash with a vague one-liner"]

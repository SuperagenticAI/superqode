# =============================================================================
# SuperQode Documentation Configuration
# =============================================================================
# MkDocs configuration for SuperQode documentation
# Build: mkdocs build
# Serve: mkdocs serve
# =============================================================================

site_name: SuperQode
site_url: https://superagenticai.github.io/superqode
site_description: "The Harness Hub where coding harnesses are discovered, built, inspected, run, evaluated, and optimized through one rich, browsable terminal experience."
site_author: Superagentic AI

repo_name: SuperagenticAI/superqode
repo_url: https://github.com/SuperagenticAI/superqode

copyright: Copyright &copy; 2026 <a href="https://super-agentic.ai" target="_blank">Superagentic AI</a>

theme:
  name: material
  logo: assets/superqode-logo.png
  favicon: assets/superqode-logo.png

  font:
    text: Inter
    code: JetBrains Mono

  # Light and dark schemes. Brand colors live in stylesheets/extra.css.
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.path
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.tabs.link
    - content.code.copy
    - content.code.annotate
    - content.tooltips
    - content.action.view
    - toc.follow

  icon:
    repo: fontawesome/brands/github
    admonition:
      note: octicons/tag-16
      abstract: octicons/checklist-16
      info: octicons/info-16
      tip: octicons/squirrel-16
      success: octicons/check-16
      question: octicons/question-16
      warning: octicons/alert-16
      failure: octicons/x-circle-16
      danger: octicons/zap-16
      bug: octicons/bug-16
      example: octicons/beaker-16
      quote: octicons/quote-16

plugins:
  - search:
      lang: en
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'
  - minify:
      minify_html: true

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/SuperagenticAI/superqode
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/superqode/
    - icon: fontawesome/solid/globe
      link: https://super-agentic.ai/superqode/
      name: SuperQode website
    - icon: fontawesome/solid/building
      link: https://super-agentic.ai
      name: Superagentic AI

  generator: false

extra_css:
  - stylesheets/extra.css



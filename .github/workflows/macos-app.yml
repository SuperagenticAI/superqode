name: Native Mac app

on:
  push:
    branches: ["**"]
    paths:
      - "apps/macos/**"
      - "src/**"
      - "tests/test_desktop*"
      - "tests/test_macos_runtime_inventory.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/macos-app.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          python-version: "3.13"
      - run: uv sync --locked --extra dev --python 3.13
      - name: Desktop and packaging regressions without accounts
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: uv run --locked --no-sync pytest -p pytest_asyncio.plugin tests/test_desktop_*.py tests/test_macos_runtime_inventory.py -q

  native:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          python-version: "3.13"
      - name: Swift transport regressions and native build
        run: swift test --build-system native --package-path apps/macos -c release
      - name: Prepare isolated bundled engine
        env:
          UV_PROJECT_ENVIRONMENT: apps/macos/.build-venv
        run: |
          uv sync --locked --no-dev --no-editable --python 3.13
          python3 apps/macos/scripts/bundle-runtime.py
          python3 apps/macos/scripts/make-icon.py
      - name: Assemble and verify an ad-hoc signed app
        env:
          SIGNING_IDENTITY: "-"
        run: |
          apps/macos/scripts/build-app.sh
          codesign --verify --deep --strict apps/macos/release/SuperQode.app
      - name: Native app smoke with loopback model fixtures
        run: python3 apps/macos/scripts/smoke-test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-smoke-report
          path: apps/macos/artifacts/smoke-report.json
          if-no-files-found: ignore

version: 1
name: native-rlm-monty-analysis
description: Native one-tool RLM for restricted repository analysis with Pydantic Monty.
flavor: coding

runtime:
  backend: rlm
  config:
    resident_root: true
    sandbox: monty
    allow_network: false
    allow_write: false
    subcall_max_calls: 16
    subcall_max_batch: 8
    subcall_max_concurrency: 4
    python_timeout: 60
    max_output_chars: 200000
    max_checkpoint_bytes: 16777216

model_policy:
  profile: rlm

execution_policy:
  sandbox: monty
  approval_profile: none
  allow_read: true
  allow_write: false
  allow_shell: false
  allow_network: false

agents:
  - id: rlm
    role: recursive-analysis
    tools:
      - python

metadata:
  example: native-rlm-monty-analysis
  model_tool_count: 1
  resident_root: true
  read_only: true

name: Private iOS companion

on:
  push:
    branches: [main]
    paths:
      - "apps/ios/**"
      - "apps/macos/Sources/SuperQode/RemoteAccessView.swift"
      - "src/superqode/desktop_service/remote_*.py"
      - "tests/test_desktop_companion*.py"
      - "tests/test_ios_feature_parity.py"
      - ".github/workflows/ios-companion.yml"
  pull_request:
    paths:
      - "apps/ios/**"
      - "src/superqode/desktop_service/remote_*.py"
      - ".github/workflows/ios-companion.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-companion-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify the Mac feature inventory
        run: python3 apps/ios/scripts/audit-parity.py --check
      - name: Build and test the ad-hoc signed companion
        shell: bash
        run: |
          set -euo pipefail
          device_id=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(device["udid"] for runtime,devices in data["devices"].items() if "iOS" in runtime for device in devices if device["name"].startswith("iPhone")))')
          echo "COMPANION_SIMULATOR_ID=$device_id" >> "$GITHUB_ENV"
          xcrun simctl boot "$device_id"
          xcrun simctl bootstatus "$device_id" -b
          xcodebuild test -project apps/ios/SuperQodeCompanion.xcodeproj -scheme SuperQodeCompanion -destination "platform=iOS Simulator,id=$device_id" -parallel-testing-enabled NO -test-timeouts-enabled YES -maximum-test-execution-time-allowance 180 -derivedDataPath "$RUNNER_TEMP/superqode-ios-build" -resultBundlePath "$RUNNER_TEMP/superqode-ios-tests.xcresult" CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=YES
      - name: Capture branded native screens
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          app_path="$RUNNER_TEMP/superqode-ios-build/Build/Products/Debug-iphonesimulator/SuperQodeCompanion.app"
          if [[ ! -f "$app_path/SuperQodeCompanion" ]]; then exit 0; fi
          device_id="$COMPANION_SIMULATOR_ID"
          state=$(xcrun simctl list devices available --json | python3 -c 'import json,os,sys; data=json.load(sys.stdin); print(next(device["state"] for devices in data["devices"].values() for device in devices if device["udid"]==os.environ["COMPANION_SIMULATOR_ID"]))')
          if [[ "$state" != "Booted" ]]; then
            xcrun simctl boot "$device_id"
          fi
          xcrun simctl bootstatus "$device_id" -b
          xcrun simctl install "$device_id" "$RUNNER_TEMP/superqode-ios-build/Build/Products/Debug-iphonesimulator/SuperQodeCompanion.app"
          xcrun simctl ui "$device_id" appearance dark
          xcrun simctl launch --terminate-running-process "$device_id" dev.superqode.companion
          sleep 2
          xcrun simctl io "$device_id" screenshot "$RUNNER_TEMP/superqode-ios-pairing.png"
          for scenario in projects conversation evaluation lab; do
            xcrun simctl launch --terminate-running-process "$device_id" dev.superqode.companion --design-preview "$scenario" -companionAppearance dark
            sleep 2
            xcrun simctl io "$device_id" screenshot "$RUNNER_TEMP/superqode-ios-$scenario.png"
          done
          xcrun simctl launch --terminate-running-process "$device_id" dev.superqode.companion --design-preview projects -companionAppearance light
          sleep 2
          xcrun simctl io "$device_id" screenshot "$RUNNER_TEMP/superqode-ios-projects-light.png"
          cp apps/ios/SuperQode/Assets.xcassets/AppIcon.appiconset/AppIcon.png "$RUNNER_TEMP/superqode-ios-icon.png"
      - name: Compile the iPhone release configuration without distribution credentials
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild build -project apps/ios/SuperQodeCompanion.xcodeproj -scheme SuperQodeCompanion -configuration Release -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/superqode-ios-release-build" CODE_SIGNING_ALLOWED=NO
      - name: Keep native test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-companion-test-results
          path: |
            ${{ runner.temp }}/superqode-ios-tests.xcresult
            ${{ runner.temp }}/superqode-ios-*.png
          if-no-files-found: ignore

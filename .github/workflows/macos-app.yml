name: Native Mac app

on:
  push:
    branches: ["**"]
    paths:
      - "apps/macos/**"
      - ".github/matchers/swift.json"
      - "src/**"
      - "tests/test_desktop*"
      - "tests/test_strands*"
      - "tests/test_harness_eval*"
      - "tests/test_repository_grader.py"
      - "tests/test_local_quickstart.py"
      - "tests/test_local_chinese_onboarding.py"
      - "tests/test_macos_runtime_inventory.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/macos-app.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          python-version: "3.13"
      - run: uv sync --locked --extra dev --python 3.13
      - name: Desktop and packaging regressions without accounts
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          uv run --locked --no-sync pytest -p pytest_asyncio.plugin
          tests/test_desktop_*.py tests/test_macos_runtime_inventory.py
          tests/test_macos_runtime_dependencies.py tests/test_agent_subprocess_cleanup.py
          tests/test_harness_acceptance.py tests/test_harness_omni.py
          tests/test_harness_eval_*.py tests/test_repository_grader.py
          tests/test_local_quickstart.py tests/test_local_chinese_onboarding.py
          tests/test_local_response_latency.py tests/test_local_model_optimizations.py
          tests/test_codegem_response_lifecycle.py tests/test_codegem_streaming.py
          tests/test_codegem_reliability.py
          tests/test_codegem_local_streaming.py tests/test_local_runtime_performance.py
          tests/test_local_airplane.py tests/test_local_stack.py
          tests/test_local_runtime_adapters.py tests/test_local_runtime_profiles.py
          tests/test_local_execution_manager.py tests/test_local_apple_bridge.py
          tests/test_local_apple_development.py
          tests/test_local_runtime_setup.py
          tests/test_local_setup_presets.py tests/test_local_comparisons.py
          tests/test_context_probe.py tests/test_local_context_contract.py -q
      - name: Install isolated Strands runtime and check actual SDK adapters
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          export SUPERQODE_TEST_STRANDS_PYTHON="$RUNNER_TEMP/strands/bin/python"
          uv run --locked --no-sync superqode harness strands setup --python "$SUPERQODE_TEST_STRANDS_PYTHON"
          uv run --locked --no-sync pytest -p pytest_asyncio.plugin tests/test_strands_backend.py tests/test_strands_setup.py tests/test_strands_surfaces.py tests/test_strands_runtime_integration.py tests/test_acp_server.py tests/test_harness_connect_catalog.py tests/test_harness_hub_catalog.py -q

  native:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          python-version: "3.13"
      - name: Swift transport regressions and native build
        run: |
          echo "::add-matcher::.github/matchers/swift.json"
          set -o pipefail
          swift test --build-system native --package-path apps/macos -c release 2>&1 | tee "$RUNNER_TEMP/superqode-swift-tests.log"
      - name: Report native test failures in check annotations
        if: failure()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "superqode-swift-tests.log"
          if path.exists():
              lines = path.read_text(errors="replace").splitlines()
              failures = [line for line in lines if any(word in line.lower() for word in ("error:", "failed", "fatal"))]
              message = "\n".join((failures or lines[-15:])[:25])[-6000:]
              message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print("::error title=Native Swift build or tests failed::" + message)
          PY
      - name: Prepare isolated bundled engine
        env:
          UV_PROJECT_ENVIRONMENT: apps/macos/.build-venv
        run: |
          python3 - <<'PY'
          import subprocess
          selected = subprocess.check_output(["uv", "python", "find", "3.13"], text=True).strip()
          subprocess.run([selected, "-c", "import json,sys;print('::notice title=Default Python selection::'+json.dumps({'version':sys.version,'base':sys.base_prefix}))"], check=True)
          PY
          # The engine payload must come from the portable managed interpreter,
          # rather than a runner's framework Python with host-specific resources.
          uv sync --managed-python --locked --no-dev --no-editable --python 3.13
          apps/macos/.build-venv/bin/python -c "import json,sys;print('::notice title=Bundled Python selection::'+json.dumps({'version':sys.version,'base':sys.base_prefix}))"
          python3 apps/macos/scripts/bundle-runtime.py
          python3 apps/macos/scripts/make-icon.py
      - name: Assemble and verify an ad-hoc signed app
        env:
          SIGNING_IDENTITY: "-"
        run: |
          set -o pipefail
          bash -x apps/macos/scripts/build-app.sh 2>&1 | tee "$RUNNER_TEMP/superqode-app-build.log"
          codesign --verify --deep --strict apps/macos/release/SuperQode.app 2>&1 | tee -a "$RUNNER_TEMP/superqode-app-build.log"
      - name: Report app packaging failures in check annotations
        if: failure()
        run: |
          python3 - <<'PY'
          import os
          import json
          import plistlib
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "superqode-app-build.log"
          if path.exists():
              lines = path.read_text(errors="replace").splitlines()
              failures = [line for line in lines if any(word in line.lower() for word in
                  ("error", "in subcomponent:", "not signed", "invalid", "denied", "no such",
                   "file modified:", "file missing:", "file added:", "unsealed"))]
              for line in (failures or lines[-5:])[-10:]:
                  message = line[-2000:].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print("::error title=Native app packaging failed::" + message)
              app = Path("apps/macos/release/SuperQode.app")
              manifest = app / "Contents/Info.plist"
              info = plistlib.loads(manifest.read_bytes()) if manifest.is_file() else {}
              executable = app / "Contents/MacOS" / info.get("CFBundleExecutable", "missing")
              context = json.dumps({"app_exists": app.is_dir(), "manifest_exists": manifest.is_file(), "executable_exists": executable.is_file(), "executable": str(executable)})
              print("::error title=Bundle filesystem diagnostics::" + context)
              for link in app.rglob("*"):
                  if link.is_symlink() and not link.exists():
                      message = f"{link.relative_to(app)} -> {os.readlink(link)}"
                      message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                      print("::error title=Broken bundle symlink::" + message)
          PY
      - name: Apple model bridge availability and private protocol
        run: >-
          python3 apps/macos/scripts/check-apple-model.py
          --helper apps/macos/release/SuperQode.app/Contents/MacOS/SuperQodeAppleModel
      - name: Native app smoke with loopback model fixtures
        env:
          SUPERQODE_NAV_PROFILE: "1"
        run: python3 apps/macos/scripts/smoke-test.py
      - name: Native Strands smoke with loopback Responses API fixture
        env:
          SUPERQODE_SMOKE_HARNESS: strands
          SUPERQODE_SMOKE_ARTIFACTS: apps/macos/artifacts-strands
        run: |
          export SUPERQODE_STRANDS_PYTHON="$RUNNER_TEMP/strands/bin/python"
          PYTHONPATH=src apps/macos/.build-venv/bin/python -c 'from superqode.main import cli_main; cli_main()' harness strands setup --python "$SUPERQODE_STRANDS_PYTHON"
          python3 apps/macos/scripts/smoke-test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-smoke-report
          path: |
            apps/macos/artifacts/smoke-report.json
            apps/macos/artifacts/navigation-main-thread-sample.txt
            apps/macos/artifacts/native-app-stderr.log
            apps/macos/artifacts-strands/smoke-report.json
            apps/macos/artifacts/connect-thread-identities-preview*.png
            apps/macos/artifacts/workspace-*.png
            apps/macos/artifacts/files.png
            apps/macos/artifacts/review.png
            apps/macos/artifacts/terminal.png
            apps/macos/artifacts/checkpoints.png
          if-no-files-found: ignore

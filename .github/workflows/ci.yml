name: CI

# Branches only. A bare `push:` also fires on tags, so every release ran the
# full suite alongside publish.yml and reported a failure against the tag.
on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Public documentation style
        run: uv run python scripts/check_public_docs_style.py
      - name: Published Agent Card is current
        run: uv run python scripts/check_published_agent_card.py
      - name: TUI keyboard and draft checks
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: uv run --frozen pytest -p pytest_asyncio.plugin tests/test_tui_productivity.py tests/test_tui_draft_recovery.py -q
      - name: Core provider tool-history checks
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: uv run --frozen pytest -p pytest_asyncio.plugin tests/test_core_tool_history.py tests/test_tool_call_repair.py tests/test_streaming_tool_calls.py tests/test_adaptive_compaction.py -q
      - name: TUI real-terminal input and rendering
        run: uv run --frozen python scripts/check_tui_terminal.py --output tui-terminal.json
      - name: TUI responsiveness budget
        run: uv run --frozen python scripts/benchmark_tui_responsiveness.py --check --output tui-responsiveness.json
      - name: Save TUI responsiveness measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tui-responsiveness
          path: |
            tui-responsiveness.json
            tui-terminal.json
          if-no-files-found: ignore

  # Pull requests only. The suite takes several minutes and carries a standing
  # backlog of failures, so running it on every push blocked work without
  # telling anyone anything new. A pull request is where it has to be green.
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Pytest
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: uv run pytest -p pytest_asyncio.plugin
      - name: Harness example doctor
        run: |
          for spec in examples/harnesses/*.yaml; do
            uv run superqode harness doctor --spec "$spec" --runtime builtin --json >/dev/null
          done

  connection-experience:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      - name: Connection and terminal interaction checks
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: uv run --frozen pytest -p pytest_asyncio.plugin tests/test_connection_experience.py tests/test_connect_harness_screen.py tests/test_subscription_billing_policy.py tests/test_harness_connect_catalog.py tests/test_tui_local_latency.py tests/test_tui_animation_bursts.py tests/test_tui_background_io.py tests/test_local_model_optimizations.py -q --junitxml=connection-tests.xml
      - name: Report connection failures
        if: failure()
        shell: python {0}
        run: |
          from pathlib import Path
          import xml.etree.ElementTree as ET
          results = Path("connection-tests.xml")
          if results.exists():
              for case in ET.parse(results).iter("testcase"):
                  for failure in [*case.findall("failure"), *case.findall("error")]:
                      message = f"{case.get('classname')}.{case.get('name')}: {failure.text or failure.get('message', '')}"
                      message = message[:6000].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                      print(f"::error::{message}")

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
      - name: Build package
        run: uv build

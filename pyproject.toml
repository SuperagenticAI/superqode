[project]
name = "superqode"
version = "2.19.0"
description = "The harness layer for coding agents"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12,<3.14"
authors = [
    {name = "Shashi Jagtap", email = "info@super-agentic.ai"}
]
maintainers = [
    {name = "Shashi Jagtap", email = "info@super-agentic.ai"}
]
keywords = ["ai", "agent-engineering", "code-engineering", "code-factory", "harness-engineering", "coding-agents", "agent-harness", "multi-agent", "orchestration", "evaluation", "optimization", "acp", "mcp", "automation", "superqode", "codegem", "gemini", "gemma", "embeddinggemma"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Build Tools",
]

dependencies = [
    "pyyaml>=6.0.3",
    "click>=8.0.0",
    "litellm>=1.83.14,<1.92",
    "agent-client-protocol>=0.10.0,<0.12",
    "prompt_toolkit>=3.0.52",
    "rich>=15.0.0",
    "textual>=8.2.8",
    "coloraide>=8.13",
    "fastmcp==3.4.4",
    "mcp>=1.27.1,<2",
    "anyio>=4.0.0",
    "httpx>=0.28.1",
    "httpx-sse>=0.4.3",
    "websockets>=15,<16",
    "starlette>=0.41.0",
    "uvicorn>=0.32.0",
    "jsonschema>=4.20.0",
    "pydantic>=2.0,<3",
    "python-frontmatter>=1.1.0",
    "superopt>=0.1.1",
    "prime-agent-python-client>=0.2.0,<0.3.0",
]

[project.optional-dependencies]
hf = [
    "huggingface_hub[hf_xet]>=1.0.0",
]
mlx = [
    "mlx-lm>=0.31.0,<0.32.0; python_version < '3.14'",
    "mlx-vlm>=0.5.0,<0.6.0; python_version < '3.14'",
]
monty = [
    "pydantic-monty>=1.0.0,<2",
]
semantic = [
    "cocoindex-code>=0.2.35,<0.3",
]
semantic-local = [
    "sentence-transformers[image]>=6.1.0,<7",
    "torchvision>=0.29.1",
]
channels = [
    "websocket-client>=1.6.0",
]
sandbox-e2b = [
    "e2b>=2.0.0",
]
sandbox-modal = [
    "modal>=1.0.0",
]
sandbox-daytona = [
    "daytona>=0.1.0",
]
sandbox-cloud = [
    "e2b>=2.0.0",
    "modal>=1.0.0",
    "daytona>=0.1.0",
]
web = [
    "textual-serve>=1.1.3",
]
extras = [
    "exa-py>=1.0.0",
]
a2a = [
    "a2a-sdk[fastapi,sqlite]>=1.1.2,<2.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
]
uhp = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
]
adk = [
    "google-adk>=2.1.0,<3.0",
]
openai-agents = [
    "openai-agents>=0.17.4",
    "openai-agents[litellm]>=0.17.4",
]
codex-sdk = [
    "openai-codex>=0.144.4,<1.0.0",
]
copilot-sdk = [
    "github-copilot-sdk>=1.0.8,<2.0.0",
]
claude-agent-sdk = [
    "claude-agent-sdk>=0.2.9,<0.3.0",
]
antigravity-sdk = [
    "google-antigravity>=0.1.8,<0.2.0",
    "protobuf>=7.35.0",
]
vendor-sdks = [
    "openai-codex>=0.144.4,<1.0.0",
    "github-copilot-sdk>=1.0.8,<2.0.0",
    "claude-agent-sdk>=0.2.9,<0.3.0",
    "google-antigravity>=0.1.8,<0.2.0",
    "protobuf>=7.35.0",
]
deepagents = [
    "deepagents>=0.7.0,<0.8.0",
    "langchain-ollama>=0.3.0",
    "langchain-openai>=0.3.0",
]
pydanticai = [
    "pydantic-ai>=1.98.0,<2.0.0",
]
pydanticai-logfire = [
    "pydantic-ai>=1.98.0,<2.0.0",
    "logfire>=4.0.0",
]
rlm-code = [
    "rlm-code[llm-all]>=0.1.11,<0.2.0",
]
tau = [
    "tau-ai>=0.3.3,<0.4.0",
]
deepseek-harness = [
    "deepseek-harness-sdk>=0.1.0rc6,<0.2.0; (sys_platform == 'darwin' and platform_machine == 'arm64') or (sys_platform == 'linux' and platform_machine == 'x86_64') or (sys_platform == 'linux' and platform_machine == 'aarch64')",
]
mem0 = [
    "mem0ai>=2.0.4,<3.0.0",
]
supermemory = [
    "supermemory>=3.45.0,<4.0.0",
]
memory-providers = [
    "mem0ai>=2.0.4,<3.0.0",
    "supermemory>=3.45.0,<4.0.0",
]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.1.1",
    "coverage>=7.0.0",
    "ruff>=0.9.6",
    "mypy>=1.17.0",
    "pre-commit>=4.1.0",
]
testing = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.1.1",
    "coverage>=7.0.0",
    "bandit>=1.8.0",
    "httpx>=0.28.1",
]
linters = [
    "bandit>=1.8.0",
    "pylint>=3.3.0",
    "flake8>=7.1.0",
    "safety>=3.0.0",
    "pip-audit>=2.10.0",
]
ui-testing = [
    "selenium>=4.27.0",
    "playwright>=1.49.0",
]
performance = [
    "locust>=2.33.0",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.5.0",
    "pymdown-extensions>=10.12.0",
    "mkdocs-minify-plugin>=0.8.0",
]
optimization = [
    "gepa>=0.1.1",
]
observability = [
    "arize-phoenix>=17.7.0",
    "arize-phoenix-otel>=0.16.1",
    "langsmith>=0.8.5",
    "logfire>=4.33.0",
    "mlflow>=3.14.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.39.1",
    "opentelemetry-sdk>=1.39.1",
]

[project.urls]
Homepage = "https://superqode.dev"
Repository = "https://github.com/SuperagenticAI/superqode"
Documentation = "https://docs.superqode.dev/"
Issues = "https://github.com/SuperagenticAI/superqode/issues"
Changelog = "https://github.com/SuperagenticAI/superqode/blob/main/CHANGELOG.md"

[project.scripts]
superqode = "superqode.main:cli_main"
sq = "superqode.main:cli_main"
superqode-codegem-index = "superqode.codegem.index_cli:main"
superqode-codegem-download = "superqode.codegem.download_cli:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
superqode = [
    "agents/data/*.toml",
    "data/*.yaml",
    "data/themes/*.json",
    "data/themes/*LICENSE*",
    "data/theme-library/*.json",
    "data/theme-library/*LICENSE*",
    "data/eval_fixtures/*.log",
    "data/eval_packs/*.yaml",
    "systemone/packs/*.yaml",
    "local/data/*.yaml",
    "local/data/model-packs/*.yaml",
    "py.typed",
]

[tool.uv]
concurrent-builds = 1
concurrent-downloads = 8
concurrent-installs = 2
conflicts = [
    [
        { extra = "a2a" },
        { extra = "antigravity-sdk" },
    ],
    [
        { extra = "a2a" },
        { extra = "vendor-sdks" },
    ],
    [
        { extra = "antigravity-sdk" },
        { extra = "mem0" },
    ],
    [
        { extra = "antigravity-sdk" },
        { extra = "memory-providers" },
    ],
    [
        { extra = "vendor-sdks" },
        { extra = "mem0" },
    ],
    [
        { extra = "vendor-sdks" },
        { extra = "memory-providers" },
    ],
    [
        { extra = "antigravity-sdk" },
        { extra = "adk" },
    ],
    [
        { extra = "antigravity-sdk" },
        { extra = "observability" },
    ],
    [
        { extra = "vendor-sdks" },
        { extra = "adk" },
    ],
    [
        { extra = "vendor-sdks" },
        { extra = "observability" },
    ],
    [
        { extra = "antigravity-sdk" },
        { extra = "sandbox-modal" },
    ],
    [
        { extra = "antigravity-sdk" },
        { extra = "sandbox-cloud" },
    ],
    [
        { extra = "vendor-sdks" },
        { extra = "sandbox-modal" },
    ],
    [
        { extra = "vendor-sdks" },
        { extra = "sandbox-cloud" },
    ],
    [
        { extra = "antigravity-sdk" },
        { extra = "pydanticai" },
    ],
    [
        { extra = "antigravity-sdk" },
        { extra = "pydanticai-logfire" },
    ],
    [
        { extra = "vendor-sdks" },
        { extra = "pydanticai" },
    ],
    [
        { extra = "vendor-sdks" },
        { extra = "pydanticai-logfire" },
    ],
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    ".eggs",
    "*.egg",
    "build",
    "dist",
    "site",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
]
ignore = [
    "E501",
    "E402",
    "F401",
    "F541",
    "F811",
    "F821",
    "F823",
    "F841",
]

[tool.ruff.lint.isort]
known-first-party = ["superqode"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: tests that require external agents, services, or credentials",
]

[tool.bandit]
exclude_dirs = ["tests", "examples", "docs", "scripts", "reference_code", "site"]
skips = ["B101"]

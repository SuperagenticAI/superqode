identity = "stdiobus.dev"
name = "stdio Bus"
short_name = "stdio-bus"
url = "https://github.com/stdiobus/stdiobus"
protocol = "acp"
author_name = "stdio Bus"
author_url = "https://github.com/stdiobus"
publisher_name = "stdio Bus"
publisher_url = "https://github.com/stdiobus"
type = "coding"
description = "ACP-compatible tool bus for connecting AI agents to development tools."
tags = ["open-source", "tools", "acp", "bus"]
run_command."*" = "stdio-bus"

help = '''
# stdio Bus

ACP-compatible tool bus for connecting AI agents to development tools.

## Installation

Download the binary for your platform from the releases page and make it
executable:

```bash
curl -L -o stdio_bus https://github.com/stdiobus/stdiobus/releases/latest/download/linux-amd64/stdio_bus
chmod +x stdio_bus
```

Or build from source (requires Make or CMake 3.10+):

```bash
git clone https://github.com/stdiobus/stdiobus
cd stdiobus
make
```

See https://github.com/stdiobus/stdiobus for details.
'''

[actions."*".install]
command = "curl -L -o stdio_bus https://github.com/stdiobus/stdiobus/releases/latest/download/linux-amd64/stdio_bus && chmod +x stdio_bus"
description = "Install stdio Bus"

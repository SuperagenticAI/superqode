help = '''
# Devin

Devin is Cognition's coding agent. SuperQode starts its native ACP server with:

```bash
devin acp
```

`devin acp` speaks JSON-RPC over stdio and is meant to be launched by an
ACP-aware client, so run it through SuperQode rather than by hand.

## Install

```bash
# macOS / Linux / WSL
curl -fsSL https://cli.devin.ai/install.sh | bash

# macOS (Homebrew)
brew install --cask devin-cli
```

On Windows use the installer or PowerShell. The install script does not work
under Git Bash or CMD. Devin Desktop already bundles the CLI for Enterprise
users.

Restart your terminal after installing so `devin` lands on PATH.

## Sign in

Devin CLI requires an authenticated Devin account before ACP will connect:

```bash
devin auth login
devin auth status
```

The official CLI owns its credential store. SuperQode never reads, copies, or
refreshes Devin tokens. If `:connect acp devin` fails to hand shake, check
`devin auth status` first.

Then connect with `:connect acp devin` or `superqode --connect acp devin`.

## Models

Devin CLI is model-agnostic and routes to Anthropic, OpenAI, Google, and
Cognition's own SWE models. Short names (`opus`, `sonnet`, `gpt`, `codex`,
`gemini`, `swe`) always resolve to the newest release in that family.

Pick one before connecting, since the choice belongs to the CLI:

```bash
devin --model opus            # per invocation
```

Or set a default in `~/.config/devin/config.json`:

```json
{ "agent": { "model": "swe-1-6-fast" } }
```

`/model` also switches models inside a native `devin` session.

## Permissions

Devin applies its own permission layer underneath ACP. `--permission-mode`
accepts `normal`, `dangerous`, and `bypass`, and the config file takes
`permissions.allow` / `deny` / `ask` rules such as `Read(**)` or `Exec(sudo)`.
SuperQode's own approval prompts still apply on top of whatever Devin allows.

## Config files

Devin reads configuration in this order, most specific last:

1. `~/.config/devin/config.json` (`%APPDATA%\devin\config.json` on Windows)
2. `.devin/config.json`, project settings, committed
3. `.devin/config.local.json`, local overrides, gitignored

Devin's `mcpServers` block uses the same schema shape as Claude Code, so MCP
servers configured for one generally transfer to the other.

## Notes

The Devin CLI is proprietary and distributed as a prebuilt binary; there is no
SDK to embed, so ACP is the supported integration path. Cloud-only features
(Playbooks, Secrets, scheduled sessions) are not exposed over the CLI.
'''

[actions."*".install]
command = "curl -fsSL https://cli.devin.ai/install.sh | bash"
description = "Install the official Devin CLI"

version: 1
name: rlm-optional-a2a
description: Bounded Monty context analysis with explicit optional remote review.
flavor: coding
runtime:
  backend: rlm
  config:
    resident_root: true
    durable_children: false
    sandbox: monty
    allow_network: false
    allow_write: false
    max_depth: 2
    max_children: 4
    max_parallel: 2
    subcall_max_calls: 8
    subcall_max_batch: 4
    subcall_max_concurrency: 2
    subcall_max_prompt_chars: 32000
    subcall_max_response_chars: 4000
    monty_max_workers: 2
    monty_memory_bytes: 67108864
    monty_recursion_depth: 128
    monty_suspensions: 128
    python_timeout: 60
    max_output_chars: 20000
    max_checkpoint_bytes: 16777216
    a2a:
      # Enable only after choosing and authorizing this peer.
      enabled: false
      hosted_enabled: false
      max_hosted_credits: 0
      max_tasks: 4
      max_parallel: 1
      max_payload_bytes: 128000
      max_result_bytes: 1000000
      deadline_seconds: 300
      peers:
        - name: reviewer
          url: http://127.0.0.1:8000
          description: Review selected evidence and cite source locations.
          skill: superqode-harness
          # For an authenticated peer, resolve its key only on the host:
          # credential_env: REVIEWER_A2A_KEY
model_policy:
  profile: rlm
execution_policy:
  sandbox: monty
  approval_profile: none
  allow_read: true
  allow_write: false
  allow_shell: false
  allow_network: false
agents:
  - id: rlm
    role: recursive-analysis
    tools: [python]
metadata:
  example: native-rlm-optional-a2a
  model_tool_count: 1
  resident_root: true
  read_only: true

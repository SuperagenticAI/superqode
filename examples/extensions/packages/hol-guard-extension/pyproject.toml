[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "superqode-hol-guard-extension"
version = "0.1.0"
description = "HOL Guard before-tool extension for SuperQode"
requires-python = ">=3.12"
dependencies = ["superqode>=0.2.68,<1.0"]

[project.entry-points."superqode.extensions"]
hol-guard = "superqode_hol_guard:extension"

[tool.hatch.build.targets.wheel]
packages = ["src/superqode_hol_guard"]

name: Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
      - name: Install docs dependencies
        run: uv sync --extra docs
      - name: Check public documentation style
        run: uv run python scripts/check_public_docs_style.py
      - name: Build documentation
        run: uv run mkdocs build --clean
      - name: Deploy documentation
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          if ! uv run mkdocs gh-deploy --force --clean > "$RUNNER_TEMP/docs-deploy.log" 2>&1; then
            cat "$RUNNER_TEMP/docs-deploy.log"
            tail -n 12 "$RUNNER_TEMP/docs-deploy.log" | while IFS= read -r line; do
              line="${line//'%'/'%25'}"
              echo "::error::$line"
            done
            exit 1
          fi
          cat "$RUNNER_TEMP/docs-deploy.log"

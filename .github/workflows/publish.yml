name: Publish

on:
  push:
    tags:
      - "v*"
  # For a rerun that should not move a tag. A tag push only fires when the tag
  # actually changes, so re-pushing an unchanged tag transfers nothing and
  # produces no event.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, for example v2.1.0
        required: true

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - id: pick
        run: echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

  # ci.yml runs the same checks, but it is a separate workflow: the two run in
  # parallel on a tag push, so it cannot gate this one. This job can, and it
  # covers everything that makes a release wrong in a way PyPI cannot undo.
  #
  # Focused runtime, TUI and release contracts gate publication. The broader
  # suite also runs on pull requests in ci.yml.
  verify:
    needs: [resolve]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Set up Node for pinned Codex protocol checks
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated Codex CLI
        run: |
          npm install --prefix "$RUNNER_TEMP/codex-cli" @openai/codex@0.160.0
          echo "$RUNNER_TEMP/codex-cli/node_modules/.bin" >> "$GITHUB_PATH"
      # Cheapest first: a wrong version fails here in seconds, before the
      # number is spent on PyPI where it cannot be withdrawn.
      - name: Validate release metadata
        run: uv run python scripts/check_release_metadata.py --tag "${{ needs.resolve.outputs.tag }}"
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Public documentation style
        run: uv run python scripts/check_public_docs_style.py
      - name: Codex protocol, session, policy and TUI release contracts
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          SUPERQODE_REQUIRE_CODEX_INTEGRATION: "1"
        run: >-
          uv run --frozen pytest -p pytest_asyncio.plugin
          tests/test_runtime_codex_cli.py tests/test_codex_cli_integration.py
          tests/test_codex_cli_ui.py tests/test_codex_harness_precedence.py
          tests/test_pure_mode_sessions.py tests/test_harness_session_bridge.py
          tests/test_session_switchboard.py tests/test_omnigent_importer.py
          tests/test_tui_smoke.py tests/test_tui_supervision.py
          tests/test_herdr.py tests/test_herdr_restore.py tests/test_slash_runtime.py -q
      - name: Native context and WorkOrder release contracts
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          uv run --frozen pytest -p pytest_asyncio.plugin
          tests/pipy/test_pipy_ship_gate.py
          tests/pipy/test_pipy_host_context.py
          tests/pipy/test_pipy_resource_inheritance.py
          tests/pipy/test_pipy_typed_tools.py
          tests/test_context_artifacts.py tests/test_context_policy.py
          tests/test_core_host_context.py tests/test_workorder_submissions.py
          tests/test_workorder_event_replay.py tests/test_workorder_evidence.py
          tests/test_benchmark_comparison.py tests/test_tui_workorder_inspection.py
          tests/test_pipy_run_recovery.py
          tests/test_tui_smoke.py::test_tui_static_commands_cover_cli_surface_except_tui_launcher -q
      - name: Published Agent Card is current
        run: uv run python scripts/check_published_agent_card.py

  rlm-contracts:
    needs: [resolve]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
      - name: Install RLM test dependencies
        run: uv sync --frozen --extra dev --extra a2a --extra monty
      - name: Require Docker for boundary checks
        run: |
          docker info
          docker pull python:3.12-slim
      - name: Native RLM, A2A and mounted TUI release contracts
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          uv run --frozen pytest -p pytest_asyncio.plugin
          tests/rlm tests/test_a2a_hosted_credits.py
          tests/test_tui_rlm_routing.py tests/test_tui_rlm_settings.py tests/test_harness_hub_screen.py
          tests/test_connect_harness_screen.py tests/test_connection_profiles.py
          tests/test_harness_drift.py tests/test_workorder_evidence.py -q

  publish:
    needs: [resolve, verify, rlm-contracts]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
      - name: Build package
        run: uv build
      # --check-url lets uv query the index and skip a distribution that is
      # already published, which keeps a rerun of the same tag idempotent.
      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: uv publish --check-url https://pypi.org/simple/
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ needs.resolve.outputs.tag }}"
          version="${tag#v}"
          python scripts/changelog_notes.py "$tag" > "${RUNNER_TEMP}/notes.md"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
            gh release edit "$tag" --notes-file "${RUNNER_TEMP}/notes.md"
          else
            gh release create "$tag" dist/* --title "$version" --notes-file "${RUNNER_TEMP}/notes.md"
          fi

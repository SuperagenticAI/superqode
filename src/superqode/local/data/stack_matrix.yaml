# SuperQode local stack recommendation matrix.
#
# This file is DATA, deliberately: the model landscape moves monthly and this
# matrix must be updatable without a code change. Users can override it with
# ~/.superqode/stack_matrix.yaml (same schema; their tiers win by id).
#
# Schema per tier:
#   id:            tier id matching HardwareProfile.tier
#   description:   one line shown by the doctor
#   engines:       ranked engine ids (first installed one wins)
#   models:        ranked candidates; `match` substrings locate already-downloaded
#                  copies in the inventory; `pull` is the suggested artifact
#   pack:          model policy pack the generated harness should reference
#   notes:         shown verbatim by the doctor

version: 2026-11-09

tiers:
  - id: apple_16
    description: "Apple Silicon, 16 to 24 GB unified memory"
    engines: [lmstudio, ollama]
    models:
      - name: "Qwen3.5 4B"
        match: ["qwen3.5:4b"]
        pull: "ollama pull qwen3.5:4b"
        role: main
        pack: qwen3
        engines: [ollama]
        source: "https://ollama.com/library/qwen3.5"
      - name: "Qwen3.5 4B"
        match: ["qwen/qwen3.5-4b"]
        pull: "lms get qwen/qwen3.5-4b"
        role: main
        pack: qwen3
        engines: [lmstudio]
        source: "https://lmstudio.ai/models/qwen/qwen3.5-4b"
      - name: "Qwen3.5 9B"
        match: ["qwen3.5:9b"]
        pull: "ollama pull qwen3.5:9b"
        role: main
        pack: qwen3
        engines: [ollama]
        source: "https://ollama.com/library/qwen3.5"
      - name: "Qwen3.5 9B"
        match: ["qwen/qwen3.5-9b"]
        pull: "lms get qwen/qwen3.5-9b"
        role: main
        pack: qwen3
        engines: [lmstudio]
        source: "https://lmstudio.ai/models/qwen/qwen3.5-9b"
    notes:
      - "Suggestions only. Fit includes context, buffers and headroom against an approximate Metal budget."
      - "LM Studio uses its own official catalog IDs, not Ollama tags. Other runtimes remain in Advanced."


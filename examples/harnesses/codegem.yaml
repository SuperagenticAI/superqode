version: 1
name: codegem-local
description: Six-tool native CodeGem harness on local Gemma
flavor: coding
runtime:
  backend: codegem
  config:
    tool_mode: auto
    thinking: true
    context_window: 32768
    max_output_tokens: 8192
    max_turns: 64
model_policy:
  primary: ollama/gemma4:12b
  profile: codegem
  config:
    system_level: core
    tool_profile: core
execution_policy:
  sandbox: none
  approval_profile: none
  allow_read: true
  allow_write: true
  allow_shell: true
  allow_network: true
agents:
  - id: codegem
    role: implementation
    tools: [read, write, edit, search, python, bash]
checks:
  enabled: false
metadata:
  example: codegem-local
  rich_stream_events: true
  pure_permissions: true
  continuity: exact-resume
